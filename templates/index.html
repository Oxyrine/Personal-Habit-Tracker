<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <h1>Habit Tracker</h1>

  <section class="card">
    <h2>Today &mdash; {{ today }}</h2>
    <ul class="checklist">
      {% for h in habits %}
      <li>
        <label>
          <input type="checkbox" class="check" data-id="{{ h.id }}" {% if h.done %}checked{% endif %}>
          <span class="name">{{ h.name }}</span>
        </label>
      </li>
      {% else %}
      <li class="empty">No habits yet. Add one below.</li>
      {% endfor %}
    </ul>

    <form method="post" action="/habits" class="add">
      <input name="name" maxlength="60" placeholder="New habit&hellip;" required autocomplete="off">
      <button type="submit">Add</button>
    </form>
  </section>

  {% if habits %}
  <section class="card">
    <header class="section-head">
      <h2>All habits</h2>
      <span class="sub">shade = habits completed that day</span>
    </header>
    <div id="overall" class="heatmap-scroll"></div>
    <div class="legend">
      0
      <span class="day l0"></span><span class="day l1"></span><span class="day l2"></span>
      <span class="day l3"></span><span class="day l4"></span>
      4+
    </div>
  </section>

  <div id="habit-sections"></div>
  {% endif %}
</main>

<script id="data" type="application/json">
  {{ {"habits": habits, "today": today} | tojson }}
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
