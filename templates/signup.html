<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Habit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-page">
  <div class="card auth-card">
    <h1>Habits</h1>
    <p class="sub">One square per day. Tick it and it turns green.</p>

    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}

    <form method="post" class="auth-form">
      <div>
        <label class="auth-label" for="name">Name</label>
        <input id="name" name="name" type="text" value="{{ name or '' }}" required autocomplete="name">
      </div>
      <div>
        <label class="auth-label" for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}" required autocomplete="email">
      </div>
      <div>
        <label class="auth-label" for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8">
        <p class="auth-hint">At least 8 characters.</p>
      </div>
      <button type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</main>
</body>
</html>
